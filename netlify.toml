# Publicação do Seu Antônio Janga
# O build monta dist/ só com o que vai para o ar (ver scripts/build.mjs).

[build]
  publish = "dist"
  command = "node scripts/build.mjs"

# URLs antigas do site anterior -> âncoras da página única
[[redirects]]
  from = "/sobre.html"
  to = "/#historia"
  status = 301
  force = true

[[redirects]]
  from = "/reservas.html"
  to = "/#reservas"
  status = 301
  force = true

[[redirects]]
  from = "/contato.html"
  to = "/#contato"
  status = 301
  force = true

[[redirects]]
  from = "/index_novo.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'"

[[headers]]
  for = "/assets/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
